<head>

<title>Quiz certyfikacyjny · Mastermind Rakieta Biznesu</title>

<style>
:root{
  --roz:#E6367B; --roz-ciemny:#B8215C; --roz-jasny:#FBE3EC; --roz-tlo:#FFF6F9;
  --tusz:#171717; --szary:#4A4A4A; --linia:#F0D3DE; --biel:#fff;
  --sans:Poppins,"Helvetica Neue",Arial,sans-serif;
  --akcent:"Cormorant Garamond",Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--biel);color:var(--tusz);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;position:relative;overflow-x:hidden}
body::before{content:"";position:fixed;top:-180px;right:-180px;width:440px;height:440px;border-radius:50%;background:var(--roz-jasny);z-index:-1}
.wrap{max-width:720px;margin:0 auto;padding:40px 16px 72px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:36px}
.brand svg{width:40px;height:40px;flex-shrink:0}
.brand span{font-size:12px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--roz-ciemny)}
h1{font-weight:800;font-size:clamp(34px,8vw,54px);line-height:1.05;margin:0;text-transform:uppercase;letter-spacing:-.01em}
.akcent{font-family:var(--akcent);font-style:italic;font-weight:600;color:var(--roz);text-transform:none;letter-spacing:0;display:block;font-size:.82em;margin-top:6px}
h2{font-weight:700;font-size:clamp(24px,5vw,32px);line-height:1.2;margin:0 0 14px}
p{margin:0 0 14px;color:var(--szary)}
.lead{font-size:18px;margin-top:22px}
.zasady{list-style:none;padding:0;margin:26px 0;display:grid;gap:10px}
.zasady li{display:flex;gap:12px;align-items:flex-start;background:var(--roz-tlo);border-radius:14px;padding:12px 16px;color:var(--tusz)}
.zasady b{color:var(--roz-ciemny);font-weight:700;min-width:46px}
.pole{display:grid;gap:6px;margin-bottom:16px}
label{font-weight:600;font-size:15px}
.podpowiedz{font-size:13px;color:var(--szary);margin:0}
input[type=text],input[type=email]{font:inherit;font-size:16px;padding:14px 16px;border:2px solid var(--linia);border-radius:14px;background:var(--biel);color:var(--tusz);width:100%}
input:focus{outline:none;border-color:var(--roz)}
.zgoda{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--szary);margin:4px 0 22px}
.zgoda input{width:20px;height:20px;accent-color:var(--roz);margin-top:2px;flex-shrink:0}
.btn{font:inherit;font-weight:700;font-size:16px;border:0;border-radius:999px;padding:15px 30px;min-height:52px;cursor:pointer;background:var(--roz);color:var(--biel);display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .15s}
.btn:hover{background:var(--roz-ciemny)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.drugi{background:transparent;color:var(--roz-ciemny);border:2px solid var(--linia)}
.btn.drugi:hover{background:var(--roz-tlo)}
.btn:focus-visible,.opcja:focus-within{outline:3px solid var(--roz-ciemny);outline-offset:3px}
.blad{color:var(--roz-ciemny);font-weight:600;font-size:14px;min-height:22px;margin:10px 0 0}
.pasek{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;color:var(--roz-ciemny);letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px}
.postep{height:8px;background:var(--roz-jasny);border-radius:999px;overflow:hidden;margin-bottom:30px}
.postep i{display:block;height:100%;background:var(--roz);border-radius:999px;transition:width .25s}
.tresc p{color:var(--tusz)}
.pytanie{font-weight:700;font-size:18px;color:var(--tusz);margin:20px 0 16px}
.opcje{display:grid;gap:10px;margin:0 0 28px;padding:0;border:0}
.opcja{display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:start;border:2px solid var(--linia);border-radius:16px;padding:14px 16px;cursor:pointer;background:var(--biel);transition:border-color .12s,background .12s}
.opcja:hover{border-color:var(--roz)}
.opcja input{position:absolute;opacity:0;pointer-events:none}
.opcja .lit{width:36px;height:36px;border-radius:50%;background:var(--roz-jasny);color:var(--roz-ciemny);font-weight:700;display:flex;align-items:center;justify-content:center}
.opcja .txt{color:var(--tusz);padding-top:5px;font-size:15.5px}
.opcja.wybrana{border-color:var(--roz);background:var(--roz-tlo)}
.opcja.wybrana .lit{background:var(--roz);color:var(--biel)}
.nawigacja{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap}
.karta{border-radius:24px;padding:30px 24px;margin-top:8px}
.karta.ok{background:var(--roz-tlo)}
.karta.ciemna{background:var(--roz-ciemny);color:var(--biel)}
.karta.ciemna h2,.karta.ciemna p{color:var(--biel)}
.wynik{font-weight:800;font-size:clamp(48px,12vw,72px);line-height:1;color:var(--roz);margin:6px 0 4px}
.karta.ciemna .wynik{color:var(--biel)}
.uwaga{background:var(--biel);border-left:5px solid var(--roz);border-radius:12px;padding:14px 16px;margin:18px 0 22px;color:var(--tusz)}
.uwaga b{color:var(--roz-ciemny)}
.stopka{margin-top:48px;font-size:13px;color:var(--szary)}
.stopka a{color:var(--roz-ciemny)}
.ladowanie{display:inline-block;width:18px;height:18px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:krec .8s linear infinite}
@keyframes krec{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.postep i,.opcja,.btn{transition:none}.ladowanie{animation-duration:2s}}
@media (max-width:480px){.nawigacja .btn{flex:1 1 auto}.karta{padding:24px 18px}}
[hidden]{display:none!important}
[tabindex="-1"]:focus{outline:none}
label.opcja,label.zgoda{font-weight:400}
</style>
</head>

var PYTANIA = [
 {m:'Moduł 1: Tożsamość', t:['Coachka kariery od czterech miesięcy ma tyle samo klientek. Jej posty mają dobre zasięgi, a w DM regularnie pojawiają się pytania o współpracę. Rozmowy w wiadomościach rzadko kończą się jednak zakupem.','W tym samym tygodniu coachka planuje zmienić nazwę oferty, przeprojektować stronę, odświeżyć kolory na Instagramie i zapisać się na kurs copywritingu. Czuje, że „wszystko trzeba poprawić”.'], q:'Które działanie najlepiej odpowiada Zasadzie Wąskiego Gardła?', o:[
  'Wprowadzić wszystkie zmiany jednocześnie, bo szybkie i nieidealne działanie jest lepsze niż czekanie, a pieniądze kochają prędkość.',
  'Ustalić, który jeden element najbardziej blokuje teraz sprzedaż (tu: rozmowy w DM), sprawdzić w 4H, skąd się bierze, i naprawiać tylko jego.',
  'Zacząć od obszaru Głowy i przed zmianami w biznesie popracować nad przekonaniami, bo problemy biznesowe odzwierciedlają nierozwiązane problemy osobiste.',
  'Postawić na zasięgi i publikować częściej, bo większa liczba odbiorców da więcej rozmów w DM, a z nich statystycznie więcej sprzedaży.']},
 {m:'Moduł 1: Tożsamość', t:['Mentorka planuje kolejny kwartał. Najpierw wpisuje do kalendarza nagrania contentu, rozmowy z klientkami, live’y i premierę nowego programu. Wyjazd z rodziną i warsztaty rozwojowe, na które od dawna chce pojechać, zamierza „dopasować, jak znajdzie się miejsce”. Poprzednie dwa kwartały planowała tak samo i w żadnym nie miała wolnego tygodnia.'], q:'Co zgodnie z Trybem Wolności i Wpływu powinna zrobić inaczej?', o:[
  'Zostawić plan bez zmian, a wyjazd zaplanować po premierze, bo jeden intensywny kwartał zbuduje przychody, które później dadzą jej więcej wolności.',
  'Uznać wyjazd i warsztaty za kamienie, a premierę za skałę, bo w tym kwartale najważniejszym priorytetem jest rozwój biznesu.',
  'Dodać do kalendarza więcej elastycznego czasu i przerwy co 90 minut pracy, żeby lepiej rozłożyć energię w ciągu tygodnia.',
  'Zacząć planowanie od skał, czyli wyjazdu z rodziną i warsztatów, a dopiero wokół nich ułożyć zobowiązania biznesowe.']},
 {m:'Moduł 1: Tożsamość', t:['Trenerka komunikacji od roku publikuje codziennie. Jej posty są rzetelne i uprzejme, np. „5 zasad dobrej prezentacji” albo „Jak mówić pewniej na spotkaniach”. Obserwujące chwalą treści, ale prawie nikt nie pyta o współpracę. W komentarzach często polecają sobie nawzajem inne trenerki.'], q:'Co najlepiej zbuduje jej pozycję liderki zgodnie z Mapą Tożsamości?', o:[
  'Określić swoje unikalne przekonania, np. z czym się w branży nie zgadza (OPINIA) albo co upraszcza (PROSTOTA), i oprzeć na nich treści wraz z soul stories.',
  'Publikować jeszcze więcej treści edukacyjnych, bo z czasem rzetelna wiedza zbuduje jej pozycję ekspertki, a zapytania o współpracę przyjdą same.',
  'Stworzyć nową, tańszą ofertę na start, żeby obserwujące, które lubią jej treści, mogły łatwiej rozpocząć współpracę i poznać jej metodę.',
  'Rozbudować posty o badania i źródła, żeby jej treści były jeszcze bardziej wiarygodne niż u innych trenerek i wyróżniały się jakością.']},
 {m:'Moduł 2: Tworzenie', t:['Doradczyni finansowa tworzy flagowy program HT dla kobiet. Wypisała problemy swoich odbiorczyń: „nie wiem, od czego zacząć oszczędzać”, „mam pierwsze oszczędności i nie wiem, co z nimi zrobić”, „chcę zainwestować pierwsze 100 tys. zł” oraz „chcę zbudować portfel na emeryturę”. Wszystkie te problemy chce zmieścić w jednej ofercie i jednej komunikacji.'], q:'Co powinna zrobić, budując flagową ofertę?', o:[
  'Objąć ofertą wszystkie poziomy Piramidy Dojrzałości, bo szeroka grupa docelowa zwiększa liczbę potencjalnych klientek programu HT.',
  'Stworzyć osobną ofertę dla każdego poziomu Piramidy Dojrzałości, żeby każda klientka dostała program idealnie dopasowany do swojego etapu.',
  'Wybrać 1–2 poziomy Piramidy Dojrzałości i wokół problemów oraz celów tych klientek zbudować Wielką Obietnicę i komunikację.',
  'Przejąć obietnicę i nazewnictwo od wiodących osób w niszy, bo skoro ich odbiorcy kupują, ta sama oferta sprawdzi się u niej.']},
 {m:'Moduł 2: Tworzenie', t:['Mentorka dla fizjoterapeutek opisuje swój flagowy program jednym zdaniem: „Pomagam fizjoterapeutkom rozwinąć gabinet i mieć więcej czasu”. W rozmowach w DM zainteresowane pytają: „A co konkretnie osiągnę?”. Każda rozumie obietnicę trochę inaczej i część rezygnuje.'], q:'Jak najlepiej poprawić jej ofertę?', o:[
  'Doprecyzować Wielką Obietnicę według schematu „Pomagam… Osiągnąć… Poprzez/Bez…”, z mierzalnym rezultatem, tak by dla dwóch różnych osób znaczyła to samo.',
  'Dodać do oferty więcej bonusów i sposobów realizacji, żeby przy tej samej obietnicy program wydawał się bardziej wartościowy.',
  'Dopisać do obietnicy kolejne Wymarzone Rezultaty, np. wolność finansową i pracę zdalną, żeby trafiła do większej liczby fizjoterapeutek.',
  'Zostawić ogólną obietnicę, a konkretne liczby pokazać dopiero w sekcji Dowód, bo zbyt konkretna obietnica zawęża grupę odbiorczyń.']},
 {m:'Moduł 2: Tworzenie', t:['Trenerka mindfulness ma gotowy zarys flagowego programu za 6 000 zł, ale jeszcze go nie sprzedaje. Najpierw chce przygotować darmowy webinar, e-book za 47 zł i miesięczną subskrypcję z medytacjami. Uważa, że bez tych elementów jej oferta będzie niekompletna.'], q:'Co zgodnie z założeniami Kosmicznej Oferty powinna zrobić?', o:[
  'Zbudować wszystkie poziomy Kosmicznej Oferty jednocześnie (Free, Impuls, Core i PP), bo działają jako całość i każdy prowadzi klientkę do kolejnego.',
  'Skupić się na flagowej ofercie (Core) i opanować jej komunikację oraz sprzedaż, a pomysły na pozostałe poziomy na razie tylko zapisać.',
  'Zacząć od poziomu Impuls, bo Generatory Gotówki szybko dadzą przychód, za który sfinansuje promocję flagowego programu.',
  'Zacząć od poziomu Free, bo darmowe materiały zbudują bazę odbiorców, którym za kilka miesięcy sprzeda flagowy program.']},
 {m:'Moduł 3: Strategia', t:['Coachka relacji tworzy treści wyłącznie z wiedzy: porady, checklisty i analizy zachowań w związkach. Posty są eksperckie, ale rzadko docierają do nowych osób. Obserwujące piszą w ankiecie, że „właściwie nie wiedzą, kim ona jest”.'], q:'Jak zgodnie z Soulmate Content powinna zmienić swoje treści?', o:[
  'Publikować jeszcze więcej porad, bo skille to najważniejszy filar treści, a posty Zademonstruj najlepiej sprzedają ofertę HT.',
  'Zastąpić treści eksperckie postami o pasjach i codziennym życiu, bo klientki kupują od osób, które lubią, a nie od ekspertek.',
  'Dodawać na końcu każdego posta zaproszenie do oferty (Zaproś), bo skoro treści są wartościowe, brakuje im tylko wyraźnego CTA.',
  'Planować treści pod wszystkie cele 4Z, a nie tylko Zademonstruj, i tworzyć je ze wszystkich trzech filarów: skilli, pasji i soul stories.']},
 {m:'Moduł 3: Strategia', t:['Mentorka z 4 tys. obserwujących chce szybko sprzedać flagowy program. Przez dwa tygodnie publikuje na feedzie codziennie post z zaproszeniem do oferty. Zasięgi spadają, nowe osoby prawie nie przychodzą, a sprzedaży nie ma.'], q:'Jak zgodnie z 4Z powinien wyglądać jej tydzień na feedzie?', o:[
  'Dalej codziennie Zaproś, ale z mocniejszym „dlaczego teraz”, np. limitem miejsc i deadline’em, bo problemem jest brak pilności.',
  '2× Zatrzymaj, 1× Zbliż, 2× Zademonstruj i 2× Zaproś, bo sprzedaż flagowej oferty wymaga częstszego zapraszania na feedzie.',
  '3× Zatrzymaj, 1× Zbliż, 2× Zademonstruj i 1× Zaproś, a zaproszenia do oferty codziennie na stories i w mailach.',
  'Przez miesiąc publikować tylko Zatrzymaj, żeby odbudować zasięgi, a do zapraszania wrócić po przekroczeniu 10 tys. obserwujących.']},
 {m:'Moduł 3: Strategia', t:['Coachka wellbeing ma 8 tys. obserwujących i aktywną społeczność. Do programu zaprasza zawsze tak samo: przez VSL z procesem krok po kroku, harmonogramem i FAQ. Kupują tylko osoby, które lubią konkret i strukturę. Reszta reaguje na stories, ale nie kupuje. Coachka planuje reklamy, żeby zdobyć więcej leadów.'], q:'Co zgodnie z Silnikiem Sprzedaży™ powinna zrobić najpierw?', o:[
  'Przedstawiać to samo zaproszenie na różne sposoby: historie przemian dla typu Emocjonalnego, wizję i społeczność dla Wizjonera, case studies dla Badacza.',
  'Uruchomić reklamy, bo skoro VSL już konwertuje, to wystarczy, że zobaczy go więcej osób, a sprzedaż wzrośnie proporcjonalnie.',
  'Stworzyć osobną ofertę dla każdego typu kupującego, żeby każdy dostał produkt dopasowany do swojego stylu podejmowania decyzji.',
  'Rozbudować VSL o kolejne kroki, dokładniejszy harmonogram i dłuższe FAQ, bo dokładny opis procesu przekona więcej osób do zakupu.']},
 {m:'Moduł 4: Sprzedaż', t:['Dietetyczka przygotowała darmowy e-book „100 przepisów i porad na zdrową dietę”, naprawdę „dowalony wartością”. W trzy miesiące zebrała 2 000 adresów e-mail. Maile mają dobre otwarcia, ale na jej program za 5 000 zł nie zapisała się ani jedna osoba. Odpowiedzi, które dostaje, to głównie prośby o kolejne darmowe materiały.'], q:'Co zgodnie z Mostami Przekonań™ powinna zmienić?', o:[
  'Dogrzewać obecną listę dłużej, np. przez kolejne trzy miesiące wysyłać jeszcze więcej wartościowych porad, aż odbiorczynie będą gotowe kupić.',
  'Zamiast lead magnetu, który edukuje, stworzyć Magnes Przejścia™, który zmienia sposób myślenia o problemie (Hook → Konfrontacja → Przeformułowanie → Zaproszenie).',
  'Stworzyć jeszcze bardziej wartościowy darmowy materiał, np. kurs wideo, żeby zebrać 10 000 adresów, bo przy większej liście sprzedaż w końcu ruszy.',
  'Przejść do Ucieleśnienia przekonania i od razu w każdym mailu zapraszać do programu za 5 000 zł, bo lista jest już wystarczająco duża.']},
 {m:'Moduł 4: Sprzedaż', t:['Coachka produktywności tworzy płatny produkt, który ma być jej Magnesem Aktywacji™. Planuje mini-kurs w 6 modułach: planowanie roku, zarządzanie energią, nawyki, organizacja skrzynki mailowej, delegowanie i praca głęboka. Kurs ma trwać 4 tygodnie, żeby uczestniczki „dostały naprawdę dużo”.'], q:'Jak powinna zmienić ten pomysł?', o:[
  'Zostawić 6 modułów, ale udostępnić wszystkie od razu, żeby uczestniczki mogły przejść kurs w swoim tempie i wybrać to, co najbardziej im potrzebne.',
  'Dodać do kursu sesję 1:1 i dostęp do społeczności, żeby Magnes Aktywacji™ dawał doświadczenie jak najbardziej zbliżone do flagowego programu.',
  'Zamienić kurs na darmowy webinar, bo Magnes Aktywacji™ ma przede wszystkim zebrać jak najwięcej leadów do dalszego dogrzewania.',
  'Wybrać jedno przekonanie i jeden mikro-problem, np. planowanie tygodnia, i dać jeden namacalny rezultat możliwy do osiągnięcia w 30–90 minut.']},
 {m:'Moduł 4: Sprzedaż', t:['Mentorka poprowadziła masterclass za 200 zł, który był jej Generatorem Gotówki™. Przyszło 40 osób, a uczestniczki pisały, że to był świetny warsztat. Dzień później wysłała im nagranie i zaproszenie do 6-miesięcznego programu za 12 000 zł. Nikt nie odpowiedział.'], q:'Co zgodnie z założeniami Generatorów Gotówki™ powinna zaproponować uczestniczkom?', o:[
  'Ten sam program za 12 000 zł, ale z rabatem 30% dla uczestniczek masterclassu, ważnym przez tydzień, żeby dać im powód do decyzji teraz.',
  'Kolejny masterclass za 200 zł za miesiąc, a do flagowego programu zaprosić dopiero po trzech lub czterech kolejnych warsztatach.',
  '30-dniową wejściówkę do flagowego programu, dostępną przez 24 godziny po warsztacie, jako wspólne wdrożenie tego, czego się nauczyły.',
  'Rozmowę sprzedażową z każdą uczestniczką, bo przy ofercie za 12 000 zł potrzebna jest osobista rozmowa, żeby rozwiać obiekcje.']},
 {m:'Moduł 5: Skalowanie', t:['Jest początek listopada. Mentorka ma w DM-ach kilkanaście osób, które odpowiadają „może”, „tak, ale nie teraz” albo „wrócę po Nowym Roku”. Jej celem jest przewidywalna sprzedaż flagowego programu w grudniu i styczniu. Na Black Friday planuje 50% zniżki na program, „bo wszyscy tak robią”.'], q:'Które podejście najlepiej odpowiada założeniom Galaktycznego Ekosystemu™?', o:[

 {m:'Moduł 5: Skalowanie', t:['Coachka ma listę mailingową z 1 500 osobami. Wysyła jeden newsletter w tygodniu z praktycznymi poradami i nigdy w nim nie sprzedaje. Gdy otwiera zapisy do programu, w jednym tygodniu wysyła pięć maili sprzedażowych. Sprzedaż jest słaba, a część osób się wypisuje i pisze, że „nagle zaczęła tylko sprzedawać”.'], q:'Co zgodnie z Email Playbook™ powinna zmienić?', o:[

  'Wyłączyć tę reklamę i dodać w jej miejsce nową, bo wydała już prawie dwa razy więcej niż cena produktu i nie przyniosła żadnego zakupu.',

var LITERY = ['A','B','C','D'];
var PROG = 12;
var stan = {imie:'', email:'', odp:[], i:0, pozostalo:2};
var app = document.getElementById('app');

function el(html){ app.innerHTML = html; window.scrollTo(0,0); var h = app.querySelector('h1,h2,.pytanie'); if(h){ h.setAttribute('tabindex','-1'); h.focus({preventScroll:true}); } }
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

function api(dane){
  if(!/^https:\/\//.test(API_URL)) return Promise.reject(new Error('config'));
  return fetch(API_URL,{method:'POST',body:JSON.stringify(dane)}).then(function(r){ if(!r.ok) throw new Error('http'); return r.json(); });
}

function ekranStart(komunikat){
  el(
   '<h1>Quiz certyfikacyjny<span class="akcent">w Rakiecie Biznesu</span></h1>'+
   '<p class="lead">Ten quiz zamyka Twoją drogę w Mastermindzie. Sprawdza, jak stosujesz metodę Rakiety Biznesu w konkretnych sytuacjach, a nie czy pamiętasz definicje.</p>'+
   '<ul class="zasady">'+
     '<li><b>15</b><span>pytań sytuacyjnych, po 3 z każdego z 5 modułów. W każdym jedna poprawna odpowiedź.</span></li>'+
     '<li><b>80%</b><span>tyle potrzeba do zaliczenia, czyli minimum 12 poprawnych odpowiedzi.</span></li>'+
     '<li><b>2×</b><span>masz dwa podejścia. Po drugim niezaliczonym quiz zostaje zablokowany.</span></li>'+
     '<li><b>✓</b><span>Po zaliczeniu Monika sprawdzi wynik i wyśle Ci zaświadczenie o ukończeniu programu.</span></li>'+
   '</ul>'+
   '<form id="f" novalidate>'+
     '<div class="pole"><label for="imie">Imię i nazwisko</label><p class="podpowiedz">Dokładnie tak, jak ma się znaleźć na zaświadczeniu.</p><input id="imie" type="text" autocomplete="name" maxlength="120" required value="'+esc(stan.imie)+'"></div>'+
     '<div class="pole"><label for="email">E-mail</label><p class="podpowiedz">Ten sam, którego używasz w Rakiecie Biznesu. Na niego przyjdzie zaświadczenie.</p><input id="email" type="email" autocomplete="email" maxlength="200" required value="'+esc(stan.email)+'"></div>'+
     '<label class="zgoda"><input id="zgoda" type="checkbox" required><span>Zgadzam się na zapisanie mojego imienia, nazwiska, adresu e-mail i wyniku quizu w celu wystawienia zaświadczenia o ukończeniu programu.</span></label>'+
     '<button class="btn" id="go" type="submit">Zaczynam quiz</button>'+
     '<p class="blad" id="blad" role="alert">'+(komunikat||'')+'</p>'+
   '</form>'
  );
  document.getElementById('f').addEventListener('submit',function(e){
    e.preventDefault();
    var imie=document.getElementById('imie').value.replace(/\s+/g,' ').trim();
    var email=document.getElementById('email').value.trim();
    var blad=document.getElementById('blad');
    if(imie.length<3||imie.indexOf(' ')<0){ blad.textContent='Wpisz imię i nazwisko.'; return; }
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){ blad.textContent='Sprawdź adres e-mail.'; return; }
    if(!document.getElementById('zgoda').checked){ blad.textContent='Zaznacz zgodę, żeby rozpocząć.'; return; }
    stan.imie=imie; stan.email=email;
    var btn=document.getElementById('go'); btn.disabled=true; btn.innerHTML='<span class="ladowanie"></span> Sprawdzam…'; blad.textContent='';
    api({action:'status',email:email}).then(function(r){
      if(!r.ok){ btn.disabled=false; btn.textContent='Zaczynam quiz'; blad.textContent= r.error==='email' ? 'Sprawdź adres e-mail.' : 'Coś poszło nie tak. Spróbuj ponownie za chwilę.'; return; }
      if(r.passed) return ekranJuzZaliczony();
      if(r.left<=0) return ekranZablokowany(null);
      stan.pozostalo=r.left;
      if(r.left===1) return ekranOstatniePodejscie();
      zacznij();
    }).catch(function(){ btn.disabled=false; btn.textContent='Zaczynam quiz'; blad.textContent='Nie udało się połączyć. Sprawdź internet i spróbuj ponownie.'; });
  });
}

function ekranOstatniePodejscie(){
  el('<h2>To Twoje drugie, ostatnie podejście</h2>'+
     '<div class="uwaga"><b>Uwaga:</b> jeśli to podejście nie zakończy się wynikiem co najmniej 80%, quiz zostanie zablokowany i nie będzie można otrzymać zaświadczenia o ukończeniu programu.</div>'+
     '<p>Nie musisz podchodzić od razu. Możesz wrócić do materiałów i otworzyć ten link później.</p>'+
     '<button class="btn" id="go">Zaczynam ostatnie podejście</button>');
  document.getElementById('go').onclick=zacznij;
}

function zacznij(){ stan.odp=new Array(PYTANIA.length); stan.i=0; pytanie(); }

function pytanie(){
  var p=PYTANIA[stan.i], n=stan.i+1, ost=n===PYTANIA.length;
  var h='<div class="pasek"><span>Pytanie '+n+' z '+PYTANIA.length+'</span><span>'+esc(p.m)+'</span></div>'+
    '<div class="postep" aria-hidden="true"><i style="width:'+(stan.i/PYTANIA.length*100)+'%"></i></div>'+
    '<div class="tresc">'+p.t.map(function(x){return '<p>'+esc(x)+'</p>';}).join('')+'</div>'+
    '<p class="pytanie" id="q">'+esc(p.q)+'</p>'+
    '<fieldset class="opcje" aria-labelledby="q">'+p.o.map(function(x,k){
      var w=stan.odp[stan.i]===LITERY[k];
      return '<label class="opcja'+(w?' wybrana':'')+'"><input type="radio" name="o" value="'+LITERY[k]+'"'+(w?' checked':'')+'><span class="lit">'+LITERY[k]+'</span><span class="txt">'+esc(x)+'</span></label>';
    }).join('')+'</fieldset>'+
    '<div class="nawigacja">'+(stan.i>0?'<button class="btn drugi" id="wstecz" type="button">← Wstecz</button>':'<span></span>')+
    '<button class="btn" id="dalej" type="button"'+(stan.odp[stan.i]?'':' disabled')+'>'+(ost?'Wyślij odpowiedzi':'Dalej →')+'</button></div>'+
    '<p class="blad" id="blad" role="alert"></p>';
  el(h);
  Array.prototype.forEach.call(app.querySelectorAll('input[name=o]'),function(r){
    r.addEventListener('change',function(){
      stan.odp[stan.i]=r.value;
      Array.prototype.forEach.call(app.querySelectorAll('.opcja'),function(o){ o.classList.toggle('wybrana', o.querySelector('input').checked); });
      document.getElementById('dalej').disabled=false;
    });
  });
  var w=document.getElementById('wstecz'); if(w) w.onclick=function(){ stan.i--; pytanie(); };
  document.getElementById('dalej').onclick=function(){
    if(!stan.odp[stan.i]) return;
    if(!ost){ stan.i++; pytanie(); return; }
    wyslij(this);
  };
}

function wyslij(btn){
  btn.disabled=true; btn.innerHTML='<span class="ladowanie"></span> Liczę wynik…';
  var blad=document.getElementById('blad'); blad.textContent='';
  api({action:'submit',name:stan.imie,email:stan.email,answers:stan.odp}).then(function(r){
    if(!r.ok){ btn.disabled=false; btn.textContent='Wyślij odpowiedzi'; blad.textContent='Nie udało się zapisać wyniku. Spróbuj ponownie.'; return; }
    if(r.alreadyPassed) return ekranJuzZaliczony();
    if(r.blocked) return ekranZablokowany(null);
    if(r.passed) return ekranZaliczony(r);
    if(r.left>0) return ekranNiezaliczony(r);
    ekranZablokowany(r);
  }).catch(function(){ btn.disabled=false; btn.textContent='Wyślij odpowiedzi'; blad.textContent='Nie udało się połączyć. Twoje odpowiedzi są zapamiętane. Spróbuj ponownie.'; });
}

function wynikHtml(r){ return '<div class="wynik">'+r.score+'/'+r.total+'</div><p><b>'+r.percent+'%</b> poprawnych odpowiedzi</p>'; }

function ekranZaliczony(r){
  el('<h1>Gratulacje!<span class="akcent">Rakieta wystartowała</span></h1>'+
     '<div class="karta ok">'+wynikHtml(r)+
     '<p>Zaliczyłaś quiz certyfikacyjny Mastermind Rakieta Biznesu.</p>'+
     '<p>Monika sprawdzi Twój wynik i wyśle zaświadczenie o ukończeniu programu na adres <b>'+esc(stan.email)+'</b>.</p></div>');
}

function ekranNiezaliczony(r){
  el('<h2>Tym razem się nie udało</h2>'+
     '<div class="karta ok">'+wynikHtml(r)+
     '<p>Do zaliczenia potrzeba minimum 80%, czyli 12 poprawnych odpowiedzi.</p></div>'+
     '<div class="uwaga"><b>Uwaga:</b> masz jeszcze tylko jedno podejście. Jeśli i ono nie zakończy się wynikiem co najmniej 80%, quiz zostanie zablokowany i nie będzie można otrzymać zaświadczenia o ukończeniu programu.</div>'+
     '<p>Możesz podejść ponownie teraz albo wrócić do materiałów i otworzyć ten link później.</p>'+
     '<button class="btn" id="go">Podchodzę ponownie</button>');
  document.getElementById('go').onclick=function(){ stan.pozostalo=r.left; zacznij(); };
}

function ekranZablokowany(r){
  el('<h2>Quiz jest zablokowany</h2>'+
     '<div class="karta ciemna">'+(r?wynikHtml(r)+'<p>Do zaliczenia potrzeba minimum 80%, czyli 12 poprawnych odpowiedzi.</p>':'')+
     '<p>Wykorzystałaś oba podejścia. Nie można już otrzymać zaświadczenia o ukończeniu programu.</p></div>');
}

function ekranJuzZaliczony(){
  el('<h2>Ten quiz masz już zaliczony</h2>'+
     '<div class="karta ok"><p>Na adres <b>'+esc(stan.email)+'</b> jest już zapisany zaliczony wynik. Zaświadczenie o ukończeniu programu przyjdzie na ten adres po weryfikacji przez Monikę.</p></div>');
}

ekranStart();
</script>

</html>
